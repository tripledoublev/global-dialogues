<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Dialogues Narrative Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/narrative.css">
    <script src="js/narrative_engine.js" defer></script>
    <script src="js/atmospheric_effects.js" defer></script>
    <script src="js/typewriter.js" defer></script>
</head>
<body>
    <!-- Introductory Screen -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-content">
            <h1 class="intro-title">Narrative Engine</h1>
            <div class="intro-text">
                <p>Global Dialogues delivers research data providing diverse public perspectives on AI. The survey consisted of open-ended opinion questions about the future of AI.</p>
                <p>We asked AI to react to the survey results.</p>
            </div>
            <button id="start-experience-btn" class="start-btn">Begin Experience</button>
        </div>
        <div class="bottom-links">
            <a href="https://hypha.coop" target="_blank">Hypha Worker Co-operative</a>&nbsp; —&nbsp;
            <a href="https://globaldialogues.ai/" target="_blank">Global Dialogues</a>
        </div>
    </div>

    <!-- Main Experience (initially hidden) -->
    <div id="main-experience" class="narrative-canvas" style="display: none;">
        <!-- Left Sidebar - Themes -->
        <div id="themes-sidebar" class="sidebar sidebar-left">
            <div class="sidebar-header">
                <h3>Themes</h3>
                <button class="sidebar-toggle" id="themes-toggle" aria-label="Toggle themes sidebar">×</button>
            </div>
            <div class="sidebar-content">
                <div id="themes-list" class="themes-list">
                    <!-- Themes populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Right Sidebar - Subthemes -->
        <div id="subthemes-sidebar" class="sidebar sidebar-right">
            <div class="sidebar-header">
                <h3>Subthemes</h3>
                <button class="sidebar-toggle" id="subthemes-toggle" aria-label="Toggle subthemes sidebar">×</button>
            </div>
            <div class="sidebar-content">
                <div id="subthemes-list" class="subthemes-list">
                    <!-- Subthemes populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div id="theme-constellation" class="theme-constellation">
                <!-- Themes populated dynamically -->
            </div>
            <div id="story-viewport" class="story-viewport"></div>
        </div>

        <div class="narrative-controls">
            <button class="control-btn" id="themes-sidebar-btn" aria-label="Toggle themes sidebar">📚</button>

            <button class="control-btn" id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>
        </div>
        <div class="narrative-progress">
            <div class="progress-bar"></div>
        </div>
     
    </div>
    <div aria-live="polite" id="sr-announcements" style="position: absolute; left: -10000px;"></div>

    <script>
        // Handle start button click
        document.getElementById('start-experience-btn').addEventListener('click', function() {
            // Add fade out animation
            const introScreen = document.getElementById('intro-screen');
            introScreen.style.opacity = '0';
            introScreen.style.transform = 'scale(0.95)';
            introScreen.style.transition = 'all 0.5s ease';
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                document.getElementById('main-experience').style.display = 'block';
                
                // Initialize the narrative engine after showing the main experience
                if (window.narrativeEngine) {
                    window.narrativeEngine.init();
                }
            }, 500);
        });
        
        // Add floating animation to background elements
        document.addEventListener('DOMContentLoaded', function() {
            const floatingElements = document.querySelectorAll('.floating-element');
            
            floatingElements.forEach((element, index) => {
                const speed = parseFloat(element.getAttribute('data-speed') || 1);
                element.style.animationDuration = `${6 / speed}s`;
                element.style.animationDelay = `${index * 2}s`;
            });
            
            // Add entrance animation to content
            const introContent = document.querySelector('.intro-content');
            if (introContent) {
                introContent.style.opacity = '0';
                
                setTimeout(() => {
                    introContent.style.transition = 'all 0.8s ease';
                    introContent.style.opacity = '1';
                }, 100);
            }
        });
    </script>
</body>
</html>
